name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: medalert-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build Linux amd64 executable
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/medalert ./cmd/medalert

      - name: Run native installation smoke test
        run: ./scripts/install-smoke-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Linux amd64 container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: medalert:ci
          outputs: type=docker,dest=/tmp/medalert-ci.tar
          provenance: false
          sbom: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}

      - name: Load tested Linux amd64 container
        run: docker load --input /tmp/medalert-ci.tar

      - name: Run container acceptance test
        run: ./scripts/container-acceptance-test.sh medalert:ci

      - name: Record tested container identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image inspect --format '{{.Id}}' medalert:ci > /tmp/medalert-ci.image-id

      - name: Upload tested container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medalert-tested-container
          path: |
            /tmp/medalert-ci.tar
            /tmp/medalert-ci.image-id
          retention-days: 1

  publish:
    name: Publish container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested container
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: medalert-tested-container
          path: /tmp/medalert-tested-container

      - name: Load tested container
        run: docker load --input /tmp/medalert-tested-container/medalert-ci.tar

      - name: Verify tested container identity
        env:
          EXPECTED_IMAGE_ID_FILE: /tmp/medalert-tested-container/medalert-ci.image-id
        run: test "$(docker image inspect --format '{{.Id}}' medalert:ci)" = "$(cat "$EXPECTED_IMAGE_ID_FILE")"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested Linux amd64 container
        env:
          IMAGE: ghcr.io/poppyseedcake/medalert
          COMMIT: ${{ github.sha }}
        run: |
          docker tag medalert:ci "$IMAGE:latest"
          docker tag medalert:ci "$IMAGE:sha-$COMMIT"

      - name: Publish tested Linux amd64 container
        env:
          IMAGE: ghcr.io/poppyseedcake/medalert
          COMMIT: ${{ github.sha }}
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$COMMIT"
